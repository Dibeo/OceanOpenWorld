name: Generate and publish Javadoc

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  javadoc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Generate Javadoc with Gradle
        run: ./gradlew javadoc --no-daemon

      - name: Prepare orphan doc branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan doc
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf *
          cp -r ${GITHUB_WORKSPACE}/build/docs/javadoc/* .
          git add -A
          git commit -m "docs: automatic Javadoc update"
          git push origin doc --force
